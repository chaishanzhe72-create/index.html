<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>追逐怪物 多武器闯关【横版】</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;overflow:hidden}
#game{display:block;background:#111}
/* 底部方向+跳跃攻击 */
.bottom-ctrl{
  position:fixed;bottom:20px;left:0;right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
}
.btn-group{
  display:flex;gap:8px;
}
.btn{
  width:64px;height:64px;
  background:rgba(255,255,255,0.25);
  color:#fff;font-size:18px;
  border:none;border-radius:50%;
  user-select:none;
  -webkit-user-select:none;
}
/* 右上角商店、重开 */
.top-right{
  position:fixed;top:16px;right:16px;
  display:flex;gap:8px;
}
.top-right .btn{
  width:54px;height:54px;
  font-size:15px;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- 右上角：商店、重开 -->
<div class="top-right">
  <button class="btn" id="btnShop">商店</button>
  <button class="btn" id="btnRestart">重开</button>
</div>
<!-- 底部：左右方向 + 跳、攻击 -->
<div class="bottom-ctrl">
  <div class="btn-group">
    <button class="btn" id="btnLeft">←</button>
    <button class="btn" id="btnRight">→</button>
  </div>
  <div class="btn-group">
    <button class="btn" id="btnJump">跳</button>
    <button class="btn" id="btnAttack">攻击</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.72;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

let player, cameraX, platforms, coins, spikes, monsters, flag, gameOver, win;
let keys = {left:false,right:false,jump:false};
let level = 1;
let money = 0;
let weapon = null;
let ownedWeapons = new Set(); // 记录已经买下的武器
let showShop = false;
let projectiles = [];
let meleeEffects = [];
const levelWidth = 2400;
const chaseRange = 220;

const weaponList = [
  {id:"knife", name:"小刀", price:20, type:"melee", range:46, effectSize:42, color:"#cccccc"},
  {id:"sword", name:"铁剑", price:45, type:"melee", range:62, effectSize:58, color:"#dddddd"},
  {id:"axe", name:"战斧", price:70, type:"melee", range:74, effectSize:70, color:"#bb8855"},
  {id:"bow", name:"木弓", price:50, type:"ranged", speed:8, projW:22, projH:7, color:"#885522"},
  {id:"crossbow", name:"弩", price:90, type:"ranged", speed:11, projW:26, projH:8, color:"#553311"},
  {id:"staff", name:"魔法杖", price:130, type:"ranged", speed:6, projW:30, projH:10, color:"#7722dd"}
];

function getWeaponInfo(id){
  return weaponList.find(w=>w.id === id);
}

function initGame(){
  player = {
    x: 50,
    y: canvas.height - 100,
    w: 26,
    h: 26,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -12,
    gravity: 0.55,
    onGround: false,
    facing: 1
  };
  cameraX = 0;
  platforms = [];
  coins = [];
  spikes = [];
  monsters = [];
  projectiles = [];
  meleeEffects = [];
  gameOver = false;
  win = false;

  function createPlatform(startX){
    platforms.push({x:startX,y:canvas.height - 40,w:220,h:14});
    let px = startX + 120;
    for(let i=0;i<8;i++){
      px += 60 + Math.random()*75;
      if(px > levelWidth) break;
      let py = 80 + Math.random()*(canvas.height - 160);
      let pw = 55 + Math.random()*50;
      platforms.push({x:px,y:py,w:pw,h:14});

      if(Math.random()>0.6){
        coins.push({x: px + pw/2 - 8, y: py - 22, w:16, h:16});
      }
      if(Math.random()>0.85 && startX!==0){
        spikes.push({x: px + pw/2 -10, y: py -12, w:20, h:12});
      }
      if(Math.random()>0.78){
        monsters.push({x: px, y: py -24, w:28, h:24, baseX:px});
      }
    }
  }
  let genX = 0;
  while(genX < levelWidth){
    createPlatform(genX);
    genX += 550;
  }
  flag = {x: levelWidth - 60, y: canvas.height - 80, w:24, h:40};
  platforms.push({x:levelWidth - 120,y:canvas.height - 40,w:120,h:14});
}

// 商店点击处理
canvas.addEventListener('touchstart', (e)=>{
  if(gameOver){
    initGame();
    return;
  }
  if(!showShop) return;
  const rect = canvas.getBoundingClientRect();
  const tx = e.touches[0].clientX - rect.left;
  const ty = e.touches[0].clientY - rect.top;
  const shopX = canvas.width/2 - 145;
  const shopY = canvas.height/2 - 150;
  let y = shopY + 60;
  for(let w of weaponList){
    if(tx > shopX && tx < shopX+280 && ty > y && ty < y+30){
      if(ownedWeapons.has(w.id)){
        weapon = w.id;
      }else if(money >= w.price){
        money -= w.price;
        ownedWeapons.add(w.id);
        weapon = w.id;
      }
      break;
    }
    y += 32;
  }
})

function drawShop(){
  ctx.fillStyle="rgba(0,0,0,0.82)";
  ctx.fillRect(canvas.width/2-145,canvas.height/2-150,290,280);
  ctx.fillStyle="#fff";
  ctx.font="20px sans-serif";
  ctx.fillText("💰金币："+money,canvas.width/2-120,canvas.height/2-120);
  let y = canvas.height/2 - 90;
  weaponList.forEach(w=>{
    let owned = ownedWeapons.has(w.id);
    let equiped = weapon === w.id;
    ctx.fillStyle = equiped ? "#3f3" : owned ? "#8cf" : "#ffd040";
    let tip = owned ? (equiped ? "✅装备中" : "点击装备") : "点击购买";
    ctx.fillText(`${w.name} ${w.price}金币 ${tip}`,canvas.width/2-120,y);
    y += 32;
  })
  ctx.fillStyle="#aaa";
  ctx.font="16px sans-serif";
  ctx.fillText("点右上角商店按钮关闭",canvas.width/2-120,y+10);
}

function attack(){
  if(!weapon) return;
  const w = getWeaponInfo(weapon);
  if(w.type === "melee"){
    let ax = player.facing>0 ? player.x + player.w : player.x - w.range;
    meleeEffects.push({
      x:ax,
      y:player.y -4,
      w:w.range,
      h:player.h+8,
      color:w.color,
      life:12
    });
    for(let i=monsters.length-1;i>=0;i--){
      let m = monsters[i];
      if(ax < m.x + m.w && ax + w.range > m.x && player.y < m.y + m.h && player.y + player.h > m.y){
        monsters.splice(i,1);
      }
    }
  }else{
    projectiles.push({
      x:player.x+player.w/2 - w.projW/2,
      y:player.y+player.h/2 - w.projH/2,
      vx: player.facing * w.speed,
      w:w.projW,
      h:w.projH,
      color:w.color
    })
  }
}

// 按钮绑定
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnJump = document.getElementById('btnJump');
const btnAttack = document.getElementById('btnAttack');
const btnShop = document.getElementById('btnShop');
const btnRestart = document.getElementById('btnRestart');

btnLeft.addEventListener('touchstart',e=>{e.preventDefault();keys.left=true;player.facing=-1;})
btnLeft.addEventListener('touchend',e=>{e.preventDefault();keys.left=false;})
btnRight.addEventListener('touchstart',e=>{e.preventDefault();keys.right=true;player.facing=1;})
btnRight.addEventListener('touchend',e=>{e.preventDefault();keys.right=false;})
btnJump.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(player.onGround) player.vy = player.jumpPower;
})
btnAttack.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!showShop) attack();
})
btnShop.addEventListener('touchstart',e=>{
  e.preventDefault();
  showShop = !showShop;
})
btnRestart.addEventListener('touchstart',e=>{
  e.preventDefault();
  initGame();
})

function loop(){
  if(gameOver || win){
    draw();
    requestAnimationFrame(loop);
    return;
  }
  if(showShop){
    draw();
    requestAnimationFrame(loop);
    return;
  }

  player.vx = 0;
  if(keys.left) player.vx = -player.speed;
  if(keys.right) player.vx = player.speed;

  player.vy += player.gravity;
  player.x += player.vx;
  player.y += player.vy;

  let targetCam = player.x - canvas.width * 0.35;
  if(targetCam > cameraX) cameraX = targetCam;

  platforms = platforms.filter(p=>p.x+p.w > cameraX - 100);
  coins = coins.filter(c=>c.x+c.w > cameraX -100);
  spikes = spikes.filter(s=>s.x+s.w > cameraX -100);
  monsters = monsters.filter(m=>m.x+m.w > cameraX -100);

  monsters.forEach(m=>{
    let dx = player.x - m.x;
    let dist = Math.hypot(dx, player.y - m.y);
    if(dist < chaseRange){
      m.x += dx>0 ? 1.6 : -1.6;
    }
  })

  for(let i=projectiles.length-1;i>=0;i--){
    let p = projectiles[i];
    p.x += p.vx;
    for(let j=monsters.length-1;j>=0;j--){
      let m = monsters[j];
      if(p.x < m.x + m.w && p.x+p.w > m.x && p.y < m.y + m.h && p.y+p.h > m.y){
        monsters.splice(j,1);
        projectiles.splice(i,1);
        break;
      }
    }
    if(p.x < cameraX -50 || p.x > cameraX + canvas.width + 100){
      projectiles.splice(i,1);
    }
  }

  meleeEffects = meleeEffects.filter(e=>{
    e.life--;
    return e.life > 0;
  })

  if(player.y > canvas.height + 50){
    gameOver = true;
  }

  player.onGround = false;
  for(let p of platforms){
    if(player.x+player.w > p.x && player.x < p.x + p.w && player.y+player.h >= p.y && player.y+player.h <= p.y + 16 && player.vy >=0){
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  for(let i=coins.length-1;i>=0;i--){
    let c = coins[i];
    if(player.x+player.w>c.x && player.x < c.x + c.w && player.y+player.h>c.y && player.y < c.y + c.h){
      coins.splice(i,1);
      money += 20;
    }
  }

  for(let s of spikes){
    if(player.x+player.w>s.x && player.x < s.x + s.w && player.y+player.h>s.y && player.y < s.y + s.h){
      gameOver = true;
    }
  }
  for(let m of monsters){
    if(player.x+player.w>m.x && player.x < m.x + m.w && player.y+player.h>m.y && player.y < m.y + m.h){
      gameOver = true;
    }
  }

  if(player.x+player.w>flag.x && player.x < flag.x + flag.w && player.y+player.h>flag.y && player.y < flag.y + flag.h){
    win = true;
  }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#2ecc71";
  platforms.forEach(p=>{
    let sx = p.x - cameraX;
    ctx.fillRect(sx,p.y,p.w,p.h);
  })

  ctx.fillStyle="#ffd700";
  coins.forEach(c=>{
    let sx = c.x - cameraX;
    ctx.fillRect(sx,c.y,c.w,c.h);
  })

  ctx.fillStyle="#ff4444";
  spikes.forEach(s=>{
    let sx = s.x - cameraX;
    ctx.beginPath();
    ctx.moveTo(sx, s.y+s.h);
    ctx.lineTo(sx+s.w/2, s.y);
    ctx.lineTo(sx+s.w, s.y+s.h);
    ctx.closePath();
    ctx.fill();
  })

  ctx.fillStyle="#ff3333";
  monsters.forEach(m=>{
    let sx = m.x - cameraX;
    ctx.fillRect(sx,m.y,m.w,m.h);
  })

  ctx.fillStyle="#ffaa00";
  let fx = flag.x - cameraX;
  ctx.fillRect(fx,flag.y,flag.w,flag.h);

  projectiles.forEach(p=>{
    ctx.fillStyle=p.color;
    let sx = p.x - cameraX;
    ctx.fillRect(sx,p.y,p.w,p.h);
  })

  meleeEffects.forEach(e=>{
    ctx.fillStyle=e.color;
    ctx.globalAlpha = e.life / 12;
    let sx = e.x - cameraX;
    ctx.fillRect(sx,e.y,e.w,e.h);
    ctx.globalAlpha=1;
  })

  ctx.fillStyle="#ffffff";
  let px = player.x - cameraX;
  ctx.fillRect(px,player.y,player.w,player.h);

  ctx.fillStyle="#fff";
  ctx.font="20px sans-serif";
  ctx.fillText("关卡："+level,15,28);
  ctx.fillText("💰"+money,15,58);
  let wInfo = getWeaponInfo(weapon);
  ctx.fillText("武器："+(wInfo?wInfo.name:"无"),15,88);

  if(gameOver){
    ctx.fillStyle="#ff3333";
    ctx.font="32px sans-serif";
    ctx.fillText("你死掉了！",canvas.width/2 - 80, canvas.height/2);
    ctx.font="18px sans-serif";
    ctx.fillText("点击画面重新开始",canvas.width/2 - 90, canvas.height/2+36);
  }
  if(win){
    ctx.fillStyle="#3f3";
    ctx.font="32px sans-serif";
    ctx.fillText("恭喜通关！",canvas.width/2 - 90, canvas.height/2);
  }
  if(showShop){
    drawShop();
  }
}

initGame();
loop();
</script>
</body>
  </html>
